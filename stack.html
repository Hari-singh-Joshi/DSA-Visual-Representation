<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Visualizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .stack-container {
            height: 600px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            background-color: #fff;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            overflow-y: auto;
        }
        .stack-node {
            width: 80%;
            max-width: 150px;
            height: 50px;
            background-color: #4e73df;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
            margin: 10px 0;
            transition: transform 0.3s ease;
        }
        .stack-node.peek {
            background-color: #f6c23e;
            animation: pulse 1.5s infinite;
        }
        .stack-node.removed {
            background-color: #e74a3b;
            animation: fadeOut 0.5s forwards;
        }
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-30px);
            }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .status-message {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <h1 class="text-center my-4">Stack Data Structure Visualizer</h1>
    <div class="row">
        <!-- Controls -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Stack Controls</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Operation</label>
                        <select id="operation" class="form-select">
                            <option value="push">Push</option>
                            <option value="pop">Pop</option>
                            <option value="peek">Peek</option>
                        </select>
                    </div>
                    <div class="mb-3" id="valueInputGroup">
                        <label class="form-label">Value</label>
                        <input type="number" id="stackValue" class="form-control" placeholder="Enter value">
                    </div>
                    <button id="executeBtn" class="btn btn-primary w-100 mb-3">
                        <i class="fas fa-play me-2"></i>Execute
                    </button>
                    <button id="clearBtn" class="btn btn-outline-danger w-100">
                        <i class="fas fa-trash-alt me-2"></i>Clear Stack
                    </button>
                    <div class="mt-4">
                        <h6>Stack Info</h6>
                        <div class="alert alert-info">
                            <p class="mb-1">Size: <span id="stackSize">0</span></p>
                            <p class="mb-1">Top Value: <span id="stackTop">None</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Visualization -->
        <div class="col-md-8">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-success text-white d-flex justify-content-between">
                    <h5 class="mb-0">Stack Visualization</h5>
                    <div>
                        <span class="badge bg-light text-dark me-2">
                            Speed: <span id="speedLabel">Normal</span>
                        </span>
                        <input type="range" id="speedControl" min="50" max="2000" value="500" class="form-range">
                    </div>
                </div>
                <div class="card-body">
                    <div class="stack-container" id="stackContainer"></div>
                    <div class="status-message text-muted" id="statusMessage"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const operationSelect = document.getElementById('operation');
    const valueInputGroup = document.getElementById('valueInputGroup');
    const stackValueInput = document.getElementById('stackValue');
    const executeBtn = document.getElementById('executeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const stackContainer = document.getElementById('stackContainer');
    const stackSizeEl = document.getElementById('stackSize');
    const stackTopEl = document.getElementById('stackTop');
    const speedControl = document.getElementById('speedControl');
    const speedLabel = document.getElementById('speedLabel');
    const statusMessage = document.getElementById('statusMessage');

    let stack = [];
    let animationSpeed = 500;

    operationSelect.addEventListener('change', () => {
        valueInputGroup.style.display = operationSelect.value === 'push' ? 'block' : 'none';
    });

    speedControl.addEventListener('input', () => {
        animationSpeed = 2050 - speedControl.value;
        speedLabel.textContent = speedControl.value < 500 ? 'Fast' : (speedControl.value < 1500 ? 'Normal' : 'Slow');
    });

    executeBtn.addEventListener('click', async () => {
        const operation = operationSelect.value;
        if (operation === 'push') {
            const value = stackValueInput.value;
            if (value === '') return showStatus('Enter a value to push.');
            await pushNode(value);
        } else if (operation === 'pop') {
            await popNode();
        } else if (operation === 'peek') {
            await peekNode();
        }
        updateStackInfo();
    });

    clearBtn.addEventListener('click', () => {
        stack = [];
        stackContainer.innerHTML = '';
        updateStackInfo();
        showStatus('Stack cleared.');
    });

    async function pushNode(value) {
        const node = document.createElement('div');
        node.className = 'stack-node';
        node.textContent = value;
        stackContainer.appendChild(node);
        stack.push({ element: node, value: value });
        showStatus(`Pushed ${value}`);
        await sleep(animationSpeed);
    }

    async function popNode() {
        if (stack.length === 0) {
            showStatus('Stack is empty.');
            return;
        }
        const node = stack.pop();
        node.element.classList.add('removed');
        await sleep(animationSpeed);
        node.element.remove();
        showStatus(`Popped ${node.value}`);
    }

    async function peekNode() {
        if (stack.length === 0) {
            showStatus('Stack is empty.');
            return;
        }
        const top = stack[stack.length - 1];
        top.element.classList.add('peek');
        showStatus(`Top value is ${top.value}`);
        await sleep(animationSpeed);
        top.element.classList.remove('peek');
    }

    function updateStackInfo() {
        stackSizeEl.textContent = stack.length;
        stackTopEl.textContent = stack.length > 0 ? stack[stack.length - 1].value : 'None';
    }

    function showStatus(message) {
        statusMessage.textContent = message;
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }
</script>
</body>
</html>
