<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Array Visualizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }

    .array-container {
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 5px;
      border: 1px solid #dee2e6;
      height: 150px;
    }

    .array-cell {
      position: relative;
      width: 80px;
      height: 80px;
      background-color: #36b9cc;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }

    .array-cell.removed {
      background-color: #e74a3b;
      animation: fadeOut 0.5s forwards;
    }

    .array-cell.updated {
      background-color: #f6c23e;
      animation: pulse 1.5s infinite;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateY(-30px);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .cell-index {
      position: absolute;
      bottom: -20px;
      font-size: 12px;
      color: #6c757d;
    }

    .status-message {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <h1 class="text-center my-4">Array Data Structure Visualizer</h1>
  <div class="row">
    <!-- Controls -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Array Controls</h5>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Operation</label>
            <select id="operation" class="form-select">
              <option value="insert">Insert</option>
              <option value="delete">Delete</option>
              <option value="update">Update</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Index</label>
            <input type="number" id="arrayIndex" class="form-control" placeholder="Index (0-based)" />
          </div>
          <div class="mb-3" id="valueInputGroup">
            <label class="form-label">Value</label>
            <input type="text" id="arrayValue" class="form-control" placeholder="Enter value" />
          </div>
          <button id="executeBtn" class="btn btn-primary w-100 mb-3">
            <i class="fas fa-play me-2"></i>Execute
          </button>
          <button id="clearBtn" class="btn btn-outline-danger w-100">
            <i class="fas fa-trash-alt me-2"></i>Clear Array
          </button>
          <div class="mt-4">
            <h6>Array Info</h6>
            <div class="alert alert-info">
              <p class="mb-1">Length: <span id="arrayLength">0</span></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Visualization -->
    <div class="col-md-8">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-success text-white d-flex justify-content-between">
          <h5 class="mb-0">Array Visualization</h5>
          <div>
            <span class="badge bg-light text-dark me-2">
              Speed: <span id="speedLabel">Normal</span>
            </span>
            <input type="range" id="speedControl" min="50" max="2000" value="500" class="form-range" />
          </div>
        </div>
        <div class="card-body">
          <div class="array-container" id="arrayContainer"></div>
          <div class="status-message text-muted" id="statusMessage"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const arrayContainer = document.getElementById("arrayContainer");
  const operationSelect = document.getElementById("operation");
  const indexInput = document.getElementById("arrayIndex");
  const valueInput = document.getElementById("arrayValue");
  const executeBtn = document.getElementById("executeBtn");
  const clearBtn = document.getElementById("clearBtn");
  const arrayLengthEl = document.getElementById("arrayLength");
  const speedControl = document.getElementById("speedControl");
  const speedLabel = document.getElementById("speedLabel");
  const statusMessage = document.getElementById("statusMessage");

  let array = [];
  let animationSpeed = 500;

  speedControl.addEventListener("input", () => {
    animationSpeed = 2050 - speedControl.value;
    speedLabel.textContent = speedControl.value < 500 ? "Fast" : speedControl.value < 1500 ? "Normal" : "Slow";
  });

  executeBtn.addEventListener("click", async () => {
    const op = operationSelect.value;
    const index = parseInt(indexInput.value);
    const value = valueInput.value;

    if (isNaN(index) || index < 0 || index > array.length) return showStatus("Invalid index.");

    if (op === "insert") {
      if (value === "") return showStatus("Enter value to insert.");
      await insertAt(index, value);
    } else if (op === "delete") {
      await deleteAt(index);
    } else if (op === "update") {
      if (value === "") return showStatus("Enter value to update.");
      await updateAt(index, value);
    }
    updateInfo();
  });

  clearBtn.addEventListener("click", () => {
    array = [];
    arrayContainer.innerHTML = "";
    updateInfo();
    showStatus("Array cleared.");
  });

  async function insertAt(index, value) {
    array.splice(index, 0, value);
    renderArray();
    showStatus(`Inserted '${value}' at index ${index}`);
    await sleep(animationSpeed);
  }

  async function deleteAt(index) {
    if (index >= array.length) return showStatus("Index out of bounds.");
    const cells = arrayContainer.children;
    cells[index].classList.add("removed");
    await sleep(animationSpeed);
    array.splice(index, 1);
    renderArray();
    showStatus(`Deleted element at index ${index}`);
  }

  async function updateAt(index, value) {
    if (index >= array.length) return showStatus("Index out of bounds.");
    array[index] = value;
    renderArray();
    const cell = arrayContainer.children[index];
    cell.classList.add("updated");
    showStatus(`Updated index ${index} to '${value}'`);
    await sleep(animationSpeed);
    cell.classList.remove("updated");
  }

  function renderArray() {
    arrayContainer.innerHTML = "";
    array.forEach((val, idx) => {
      const cell = document.createElement("div");
      cell.className = "array-cell";
      cell.textContent = val;
      const indexLabel = document.createElement("div");
      indexLabel.className = "cell-index";
      indexLabel.textContent = idx;
      cell.appendChild(indexLabel);
      arrayContainer.appendChild(cell);
    });
  }

  function updateInfo() {
    arrayLengthEl.textContent = array.length;
  }

  function showStatus(msg) {
    statusMessage.textContent = msg;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
</script>
</body>
</html>
